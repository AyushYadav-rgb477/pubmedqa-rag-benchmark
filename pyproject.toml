[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "biomedqa"
version = "0.0.1"
description = "Biomedical QA on PubMedQA: closed-book vs. retrieval-augmented LLM vs. oracle vs. fine-tuned PubMedBERT."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ayush Yadav" }]
requires-python = ">=3.11"
# Core deps stay light: they are installed in CI. Heavy deps live in extras.
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pre-commit>=3.7",
]
# Fine-tuning PubMedBERT (Colab GPU). Versions match the known-good Colab stack.
classifier = [
    "torch==2.6.0",
    "transformers==4.51.3",
    "accelerate==1.6.0",
    "datasets>=3.0",
    "scikit-learn>=1.4",
]
# Local open LLM in 4-bit (Colab T4).
llm = [
    "torch==2.6.0",
    "transformers==4.51.3",
    "accelerate==1.6.0",
    "bitsandbytes==0.45.5",
]
# Building the retrieval corpus from Hugging Face.
corpus = [
    "datasets>=3.0",
]
# BM25 retrieval.
retrieval = [
    "bm25s>=0.2",
    "PyStemmer>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/biomedqa"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["biomedqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
